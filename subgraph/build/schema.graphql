type Trade @entity(immutable: false) {
  id: ID!
  tradeId: BigInt!
  user: Bytes!
  tokenIn: Bytes!
  tokenOut: Bytes!
  amountIn: BigInt!
  amountRemaining: BigInt!
  minAmountOut: BigInt!
  realisedAmountOut: BigInt!
  isInstasettlable: Boolean!
  instasettleBps: BigInt!
  lastSweetSpot: BigInt!
  usePriceBased: Boolean!
  onlyInstasettle: Boolean!
  attempts: Int!
  status: String!
  createdAt: BigInt!
  updatedAt: BigInt!
  executions: [TradeExecution!]! @derivedFrom(field: "trade")
  cancellations: [TradeCancellation!]! @derivedFrom(field: "trade")
  instasettlements: [TradeInstasettlement!]! @derivedFrom(field: "trade")
  completions: [TradeCompletion!]! @derivedFrom(field: "trade")
  attemptEvents: [TradeAttempt!]! @derivedFrom(field: "trade")
  streamFees: [StreamFee!]! @derivedFrom(field: "trade")
  instasettleFees: [InstasettleFee!]! @derivedFrom(field: "trade")
}

type TradeExecution @entity(immutable: true) {
  id: ID!
  trade: Trade!
  amountIn: BigInt!
  realisedAmountOut: BigInt!
  lastSweetSpot: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

type TradeCancellation @entity(immutable: true) {
  id: ID!
  trade: Trade!
  isAutocancelled: Boolean!
  amountRemaining: BigInt!
  realisedAmountOut: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

type TradeInstasettlement @entity(immutable: true) {
  id: ID!
  trade: Trade!
  settler: Bytes!
  totalAmountIn: BigInt!
  totalAmountOut: BigInt!
  totalFees: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

type TradeCompletion @entity(immutable: true) {
  id: ID!
  trade: Trade!
  finalRealisedAmountOut: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

type TradeAttempt @entity(immutable: true) {
  id: ID!
  trade: Trade!
  attempts: Int!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

type StreamFee @entity(immutable: true) {
  id: ID!
  trade: Trade!
  bot: Bytes!
  token: Bytes!
  protocolFee: BigInt!
  botFee: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

type InstasettleFee @entity(immutable: true) {
  id: ID!
  trade: Trade!
  settler: Bytes!
  token: Bytes!
  protocolFee: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

type DEXRoute @entity(immutable: false) {
  id: ID!
  dex: Bytes!
  router: Bytes
  isActive: Boolean!
  addedAt: BigInt!
  removedAt: BigInt
  routerUpdatedAt: BigInt
}

type DEXRouterUpdate @entity(immutable: true) {
  id: ID!
  dex: Bytes!
  router: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

type Bot @entity(immutable: false) {
  id: ID!
  bot: Bytes!
  isWhitelisted: Boolean!
  addedAt: BigInt
  removedAt: BigInt
}

type BotEvent @entity(immutable: true) {
  id: ID!
  bot: Bytes!
  action: String!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

type FeeClaim @entity(immutable: true) {
  id: ID!
  recipient: Bytes!
  token: Bytes!
  amount: BigInt!
  isProtocol: Boolean!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

type FeeRateUpdate @entity(immutable: true) {
  id: ID!
  streamProtocolFeeBps: Int!
  streamBotFeeBps: Int!
  instasettleProtocolFeeBps: Int!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

type LowLevelError @entity(immutable: true) {
  id: ID!
  error: String!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

type DataError @entity(immutable: true) {
  id: ID!
  error: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

# Internal helper to bridge event ordering inside placeTrade.
# In placeTrade the initial stream emits TradeStreamExecuted and StreamFeesTaken
# BEFORE TradeCreated, so the Trade entity does not yet exist when the stream
# fees fire. We accumulate them here keyed by tradeId; handleTradeCreated
# consumes the pending total and removes the entity so Trade.realisedAmountOut
# matches the on-chain (net) storage value.
type PendingStreamFees @entity(immutable: false) {
  id: ID!
  totalFees: BigInt!
}
