specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Core
    network: mainnet
    source:
      address: "0xD0B6DaD2Dc5dad47bEB7C3D7Dd7980a20CD6a710"  # Decastream Core v2.2.1
      abi: Core
      startBlock: 25093744  # v2.2.1 deployment block
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Trade
        - TradeExecution
        - TradeCancellation
        - TradeInstasettlement
        - TradeCompletion
        - TradeAttempt
        - StreamFee
        - InstasettleFee
        - FeeClaim
        - FeeRateUpdate
        - Bot
        - BotEvent
        - LowLevelError
        - DataError
      abis:
        - name: Core
          file: ./abis/Core.json
      eventHandlers:
        - event: TradeCreated(indexed uint256,indexed address,address,address,uint256,uint256,uint256,uint256,bool,uint256,uint256,bool,bool)
          handler: handleTradeCreated
        - event: TradeStreamExecuted(indexed uint256,uint256,uint256,uint256)
          handler: handleTradeStreamExecuted
        - event: TradeCancelled(bool,indexed uint256,uint256,uint256)
          handler: handleTradeCancelled
        - event: TradeInstasettled(indexed uint256,indexed address,uint256,uint256,uint256)
          handler: handleTradeInstasettled
        - event: TradeCompleted(indexed uint256,uint256)
          handler: handleTradeCompleted
        - event: AttemptsIncremented(indexed uint256,uint8)
          handler: handleAttemptsIncremented
        - event: StreamFeesTaken(indexed uint256,indexed address,indexed address,uint256,uint256)
          handler: handleStreamFeesTaken
        - event: InstasettleFeeTaken(indexed uint256,indexed address,indexed address,uint256)
          handler: handleInstasettleFeeTaken
        - event: FeesClaimed(indexed address,indexed address,uint256,bool)
          handler: handleFeesClaimed
        - event: FeeRatesUpdated(uint16,uint16,uint16)
          handler: handleFeeRatesUpdated
        - event: BotAdded(indexed address)
          handler: handleBotAdded
        - event: BotRemoved(indexed address)
          handler: handleBotRemoved
        - event: LowLevelError(string)
          handler: handleLowLevelError
        - event: DataError(bytes)
          handler: handleDataError
      file: ./src/mapping.ts

  - kind: ethereum/contract
    name: StreamDaemon
    network: mainnet
    source:
      address: "0xfc61Dd8254F07b515b0529032181DA1cC42518c1"  # Decastream StreamDaemon v2.2.1
      abi: StreamDaemon
      startBlock: 25093744  # v2.2.1 deployment block
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - DEXRoute
        - DEXRouterUpdate
      abis:
        - name: StreamDaemon
          file: ./abis/StreamDaemon.json
      eventHandlers:
        - event: DEXRouteAdded(indexed address)
          handler: handleDEXRouteAdded
        - event: DEXRouteRemoved(indexed address)
          handler: handleDEXRouteRemoved
        - event: DEXRouterUpdated(indexed address,indexed address)
          handler: handleDEXRouterUpdated
      file: ./src/mapping.ts
